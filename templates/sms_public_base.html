<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EPI-USE America, Inc. SMS Program{% endblock %}</title>
  <style>
    :root {
      --navy: #09275a;
      --navy-2: #163d72;
      --red: #e3222a;
      --ink: #061b42;
      --muted: #5f7394;
      --line: #d8e4f2;
      --soft: #f4f8fc;
      --card: #ffffff;
      --success: #0f7a46;
      --danger: #a31822;
      --radius: 8px;
      --shadow: 0 24px 70px rgba(9, 39, 90, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(22, 61, 114, 0.18), transparent 34rem),
        linear-gradient(180deg, #f7fbff 0%, #edf4fa 100%);
      line-height: 1.55;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 32px;
      background: var(--navy);
      color: #fff;
      box-shadow: 0 12px 34px rgba(9, 39, 90, 0.24);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      width: 230px;
      max-width: 44vw;
      height: auto;
      display: block;
      padding: 6px 10px;
      border-radius: var(--radius);
      background: #fff;
    }

    .brand-kicker {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 2px 0 0;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-link {
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      background: rgba(255,255,255,0.08);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 28px;
      align-items: start;
      padding: 44px 48px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #071f50 0%, #173d73 58%, #7ba8c4 100%);
      box-shadow: var(--shadow);
    }

    .eyebrow,
    .section-label {
      margin: 0 0 10px;
      color: var(--red);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .hero .eyebrow { color: #d8edff; }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 4.1rem);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 660px;
      margin: 22px 0 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.08rem;
    }

    .hero-panel {
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.12);
    }

    .hero-panel strong {
      display: block;
      margin-bottom: 8px;
      color: #fff;
      font-size: 1.2rem;
    }

    .hero code {
      color: var(--navy);
      background: rgba(255,255,255,0.92);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #155eef;
      background: #fff;
      text-decoration: none;
      font-weight: 900;
    }

    .button-link.primary {
      border-color: var(--red);
      color: #fff;
      background: var(--red);
      box-shadow: 0 14px 28px rgba(227, 34, 42, 0.22);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 28px;
      margin-top: 28px;
    }

    .grid-balanced {
      grid-template-columns: 1fr 1fr;
    }

    .card {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 18px 50px rgba(9, 39, 90, 0.08);
    }

    .card h2,
    .card h3 {
      margin: 0 0 14px;
      line-height: 1.1;
    }

    .muted { color: var(--muted); }

    .summary-list {
      display: grid;
      gap: 12px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .summary-list li {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--soft);
    }

    .summary-list strong {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
    }

    .document {
      max-width: 960px;
      margin: 0 auto;
    }

    .document-header {
      margin-bottom: 24px;
      padding: 34px;
      border-radius: var(--radius);
      color: #fff;
      background: linear-gradient(135deg, #071f50 0%, #173d73 60%, #7ba8c4 100%);
      box-shadow: var(--shadow);
    }

    .document-header h1 {
      max-width: 760px;
    }

    .document-header p {
      max-width: 720px;
      color: rgba(255,255,255,0.88);
    }

    .term-grid {
      display: grid;
      gap: 16px;
    }

    .term-section {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 12px 34px rgba(9, 39, 90, 0.06);
    }

    .term-section h2 {
      margin-top: 0;
      color: var(--ink);
    }

    label {
      display: block;
      margin-top: 18px;
      color: #263e63;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      margin-top: 8px;
      padding: 15px 16px;
      border: 1px solid #c6d6e8;
      border-radius: var(--radius);
      color: var(--ink);
      background: #fbfdff;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgba(21, 94, 239, 0.14);
      border-color: #3d73d8;
    }

    .checkbox-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 12px;
      margin-top: 22px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--soft);
    }

    .checkbox-row input {
      width: 20px;
      height: 20px;
      margin-top: 2px;
    }

    .checkbox-row label {
      margin: 0;
      color: #1c3357;
      font-size: 0.98rem;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }

    .hp-field {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px 20px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--red);
      box-shadow: 0 14px 28px rgba(227, 34, 42, 0.22);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .success,
    .errors,
    .notice {
      padding: 16px 18px;
      border-radius: var(--radius);
    }

    .success {
      border: 1px solid #a4dfbf;
      background: #eefbf3;
      color: #0d4f31;
    }

    .errors {
      border: 1px solid #f0b0b0;
      background: #fff2f2;
      color: var(--danger);
    }

    .notice {
      border: 1px solid var(--line);
      background: var(--soft);
      color: #2d4264;
    }

    .check-list {
      display: grid;
      gap: 12px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .check-list li {
      padding-left: 26px;
      position: relative;
    }

    .check-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
    }

    .legal-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .legal-links a {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #155eef;
      background: #fff;
      text-decoration: none;
      font-weight: 800;
    }

    code {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #eef4ff;
      color: var(--navy);
      font-size: 1rem;
    }

    a { color: #155eef; }

    @media (max-width: 820px) {
      .topbar,
      .brand {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-links { display: none; }

      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="{{ url_for('static', filename='logo.jpg') }}" alt="EPI-USE">
      <div>
        <p class="brand-kicker">A Member of Group Elephant</p>
        <p class="brand-title">Billable Hours Tracker</p>
      </div>
    </div>
    <nav class="top-links" aria-label="SMS pages">
      <a class="top-link" href="/sms-opt-in">Home</a>
      <a class="top-link" href="/sms-terms">SMS Terms</a>
      <a class="top-link" href="/sms-privacy">SMS Privacy</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
